<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription vendeur - Surprend Moi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="header-container" style="justify-content: center;">
    <a href="index.html" class="brand">
      <img src="https://res.cloudinary.com/mtwv68nx/image/upload/w_150,q_auto,f_auto/v1792677426/mfd0dxaprxrc6u5pjmo9.png" alt="Surprend Moi" class="logo">
    </a>
  </div>
</header>

<main class="container-narrow">
  <div class="card">
    <h2 class="card-title">Devenir vendeur</h2>

    <form id="formVendeur">
      <div class="form-group">
        <label>Nom complet</label>
        <input type="text" id="vNom" required placeholder="Votre nom">
      </div>
      <div class="form-group">
        <label>Nom de la boutique</label>
        <input type="text" id="vBoutique" required placeholder="Ex : Bracelets Jean">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="vEmail" required placeholder="votre@email.com">
      </div>
      <div class="form-group">
        <label>Telephone WhatsApp</label>
        <input type="tel" id="vTel" required placeholder="257XXXXXXXX">
        <div class="form-hint">Format international sans le signe plus</div>
      </div>
      <div class="form-group">
        <label>Categorie principale</label>
        <select id="vCat" required>
          <option value="">Choisir</option>
          <option>Bracelets</option>
          <option>Gateaux</option>
          <option>Fleurs</option>
          <option>Rolls Eggs</option>
          <option>Vetements</option>
          <option>Autre</option>
        </select>
      </div>
      <div class="form-group">
        <label>Zone</label>
        <input type="text" id="vZone" required placeholder="Ex : Bujumbura, Rohero">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="vPass" required minlength="6" placeholder="Minimum 6 caracteres">
      </div>

      <button type="submit" class="btn btn-primary" id="btnV" style="width: 100%; margin-top: 10px;">Ouvrir ma boutique</button>
    </form>

    <div id="alerte" class="alert hidden"></div>

    <p style="text-align:center; color:var(--text-soft); font-size:14px; margin-top:24px;">
      Deja un compte ? <a href="connexion.html" style="color:var(--accent-2); font-weight:bold;">Se connecter</a>
    </p>
  </div>
</main>

<footer class="footer" style="margin-top: 40px; padding: 20px; text-align: center; border-top: 1px solid var(--border);">
  <p style="font-size: 12px; color: var(--text-mute);">&copy; 2025 SurprendMoi.</p>
</footer>

<script src="js/config.js"></script>
<script src="js/track.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById('formVendeur').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('btnV');
    var alerte = document.getElementById('alerte');
    btn.disabled = true;
    btn.textContent = 'Creation...';

    SM_AUTH.inscrireVendeur({
      nom: document.getElementById('vNom').value.trim(),
      boutique: document.getElementById('vBoutique').value.trim(),
      email: document.getElementById('vEmail').value.trim().toLowerCase(),
      telephone: document.getElementById('vTel').value.trim(),
      categorie: document.getElementById('vCat').value,
      zone: document.getElementById('vZone').value.trim(),
      password: document.getElementById('vPass').value
    }).then(function () {
      alerte.className = 'alert alert-success';
      alerte.textContent = 'Boutique creee. Connecte-toi pour ajouter tes produits.';
      alerte.classList.remove('hidden');
      document.getElementById('formVendeur').reset();
      setTimeout(function () { location.href = 'connexion.html'; }, 1500);
    }).catch(function (err) {
      alerte.className = 'alert alert-error';
      alerte.textContent = 'Erreur : ' + err.message;
      alerte.classList.remove('hidden');
    }).then(function () {
      btn.disabled = false;
      btn.textContent = 'Ouvrir ma boutique';
    });
  });
</script>
</body>
</html>
