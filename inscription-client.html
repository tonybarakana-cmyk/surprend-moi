<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b10">
<title>Inscription client - Surprend Moi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <a href="index.html" class="brand">Surprend Moi</a>
</header>

<main class="container-narrow">
  <div class="card" style="margin-top:24px;">
    <h2 class="card-title">Creer un compte client</h2>

    <form id="formClient">
      <div class="form-group">
        <label>Nom complet</label>
        <input type="text" id="cNom" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="cEmail" required>
      </div>
      <div class="form-group">
        <label>Telephone WhatsApp</label>
        <input type="tel" id="cTel" required placeholder="257XXXXXXXX">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="cPass" required minlength="6">
        <div class="form-hint">Minimum 6 caracteres</div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="btnC">Creer mon compte</button>
    </form>

    <div id="alerte" class="alert hidden"></div>

    <p style="text-align:center;color:var(--text-soft);font-size:14px;margin-top:18px;">
      Deja un compte ? <a href="connexion.html" style="color:var(--accent-1);">Se connecter</a>
    </p>
  </div>
</main>

<footer class="footer">Surprend Moi</footer>

<script src="js/config.js"></script>
<script src="js/track.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById('formClient').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('btnC');
    var alerte = document.getElementById('alerte');
    btn.disabled = true;
    btn.textContent = 'Creation...';

    SM_AUTH.inscrireClient({
      nom: document.getElementById('cNom').value.trim(),
      email: document.getElementById('cEmail').value.trim().toLowerCase(),
      telephone: document.getElementById('cTel').value.trim(),
      password: document.getElementById('cPass').value
    }).then(function () {
      alerte.className = 'alert alert-success';
      alerte.textContent = 'Compte cree. Tu peux te connecter.';
      alerte.classList.remove('hidden');
      document.getElementById('formClient').reset();
      setTimeout(function () { location.href = 'connexion.html'; }, 1200);
    }).catch(function (err) {
      alerte.className = 'alert alert-error';
      alerte.textContent = 'Erreur : ' + err.message;
      alerte.classList.remove('hidden');
    }).then(function () {
      btn.disabled = false;
      btn.textContent = 'Creer mon compte';
    });
  });
</script>
</body>
</html>
