<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07110B">
<title>Connexion - Surprend Moi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="header-container" style="justify-content: center;">
    <a href="index.html" class="brand">
      <img src="https://res.cloudinary.com/mtwv68nx/image/upload/w_150,q_auto,f_auto/v1792677426/mfd0dxaprxrc6u5pjmo9.png" alt="Surprend Moi" class="logo">
    </a>
  </div>
</header>

<main class="container-narrow">
  <div class="card">
    <h2 class="card-title">Connexion</h2>

    <form id="formConnexion">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="votre@email.com">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" required placeholder="Votre mot de passe">
      </div>

      <button type="submit" class="btn btn-primary" id="btnLogin" style="width: 100%; margin-top: 10px;">Se connecter</button>
    </form>

    <div id="alerte" class="alert hidden"></div>

    <p style="text-align:center; color:var(--text-soft); font-size:14px; margin-top:24px;">
      Pas de compte ? <a href="inscription.html" style="color:var(--accent-2); font-weight:bold;">S'inscrire</a>
    </p>
  </div>
</main>

<footer class="footer" style="margin-top: 40px; padding: 20px; text-align: center; border-top: 1px solid var(--border);">
  <p style="font-size: 12px; color: var(--text-mute);">&copy; 2025 SurprendMoi.</p>
</footer>

<script src="js/config.js"></script>
<script src="js/track.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById('formConnexion').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('btnLogin');
    var alerte = document.getElementById('alerte');
    btn.disabled = true;
    btn.textContent = 'Connexion...';
    alerte.classList.add('hidden');

    var email = document.getElementById('email').value.trim().toLowerCase();
    var password = document.getElementById('password').value;

    SM_AUTH.connexion(email, password).then(function (res) {
      if (res.error || !res.user) {
        throw new Error(res.error || 'Email ou mot de passe incorrect');
      }
      
      SM_AUTH.saveSession(res.user);
      
      // REDIRECTION SELON LE RÔLE
      if (res.user.role === 'admin') {
        window.location.href = 'dashboard-admin.html';
      } else if (res.user.role === 'vendeur') {
        window.location.href = 'dashboard-vendeur.html';
      } else {
        window.location.href = 'dashboard-client.html';
      }
    }).catch(function (err) {
      alerte.className = 'alert alert-error';
      alerte.textContent = err.message;
      alerte.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Se connecter';
    });
  });
</script>
</body>
</html>
