<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07110B">
<title>Boutique - Surprend Moi</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Styles pour la barre de recherche avancée de la boutique */
  .shop-toolbar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .shop-search {
    flex: 1;
    min-width: 200px;
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .shop-search input {
    flex: 1;
    background: none;
    border: none;
    color: #fff;
    outline: none;
    font-size: 14px;
  }
  .shop-search svg { color: var(--text-mute); margin-right: 8px; }
  .shop-filter {
    background: var(--bg);
    border: 1px solid var(--border);
    color: #fff;
    padding: 10px 14px;
    border-radius: 10px;
    outline: none;
    font-size: 14px;
    cursor: pointer;
  }
  .shop-filter option { background: var(--surface); }
</style>
</head>
<body>

<!-- HEADER (Juste le logo, sans les liens de navigation) -->
<header class="header">
  <div class="header-container" style="justify-content: center;">
    <a href="index.html" class="brand">
      <img src="https://res.cloudinary.com/mtwv68nx/image/upload/w_150,q_auto,f_auto/v1792677426/mfd0dxaprxrc6u5pjmo9.png" alt="Surprend Moi" class="logo">
    </a>
  </div>
</header>

<main class="main-layout" style="grid-template-columns: 1fr; max-width: 1200px; margin-top: 100px;">
  
  <!-- EN-TETE DE LA BOUTIQUE -->
  <div id="shopHeader" style="display: flex; align-items: center; gap: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-bottom: 24px;">
    <div class="loader"></div>
  </div>

  <!-- BARRE DE RECHERCHE AVANCEE -->
  <div class="shop-toolbar">
    <div class="shop-search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="shopSearchInput" placeholder="Rechercher dans cette boutique...">
    </div>
    <select id="shopSort" class="shop-filter">
      <option value="recent">Plus recents</option>
      <option value="prix_asc">Prix croissant</option>
      <option value="prix_desc">Prix decroissant</option>
      <option value="nom">Nom (A-Z)</option>
    </select>
    <select id="shopCat" class="shop-filter">
      <option value="Tout">Toutes categories</option>
    </select>
  </div>

  <div class="section-header">
    <h2 class="section-title">Nos produits</h2>
  </div>
  
  <div id="shopProduits" class="produits-grid">
    <div class="loader"></div>
  </div>

  <div class="empty-state hidden" id="shopVide">
    <h3>Aucun produit trouve</h3>
  </div>

</main>

<footer class="footer">
  <div class="footer-container">
    <img src="https://res.cloudinary.com/mtwv68nx/image/upload/w_120,q_auto,f_auto/v1792677426/mfd0dxaprxrc6u5pjmo9.png" alt="Surprend Moi" class="logo-footer">
    <div class="footer-links">
      <a href="index.html">Accueil</a>
      <a href="a-propos.html">A propos</a>
      <a href="confidentialite.html">Politique de confidentialite</a>
    </div>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/track.js"></script>
<script src="js/auth.js"></script>
<script src="js/produits.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var params = new URLSearchParams(location.search);
    var shopName = params.get('shop');
    var headerContainer = document.getElementById('shopHeader');
    var grid = document.getElementById('shopProduits');
    var shopVide = document.getElementById('shopVide');
    var searchInput = document.getElementById('shopSearchInput');
    var sortSelect = document.getElementById('shopSort');
    var catSelect = document.getElementById('shopCat');

    if (shopName) {
      shopName = decodeURIComponent(shopName).trim();
    }

    if (!shopName) {
      headerContainer.innerHTML = '<h2 style="color:#fff; text-align:center; width:100%;">Boutique introuvable</h2>';
      grid.innerHTML = '';
      return;
    }

    var tousLesProduits = [];
    var vendeurActuel = null;

    SM_PRODUITS.tousVendeurs().then(function(vendeurs) {
      vendeurActuel = vendeurs.find(function(v) { 
        return v.boutique.trim().toLowerCase() === shopName.toLowerCase(); 
      });

      if (!vendeurActuel) {
        headerContainer.innerHTML = '<h2 style="color:#fff; text-align:center; width:100%;">Boutique introuvable</h2>';
        return;
      }

      // Affichage du profil vendeur
      var initiale = vendeurActuel.boutique.charAt(0).toUpperCase();
      var photoHtml = vendeurActuel.photo 
        ? `<img src="${vendeurActuel.photo}" style="width: 100%; height: 100%; object-fit: cover;">` 
        : initiale;

      headerContainer.innerHTML = `
        <div style="width: 80px; height: 80px; background: var(--accent-1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; color: #000; overflow: hidden; border: 2px solid var(--accent-2); flex-shrink: 0;">
          ${photoHtml}
        </div>
        <div>
          <h1 style="font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 4px;">${vendeurActuel.boutique}</h1>
          <p style="font-size: 14px; color: var(--text-soft); margin-bottom: 4px;">${vendeurActuel.zone}</p>
          ${vendeurActuel.specialite ? `<span style="font-size: 12px; background: rgba(22,199,101,0.1); color: var(--accent-2); padding: 4px 10px; border-radius: 6px; font-weight: 700;">Spécialité : ${vendeurActuel.specialite}</span>` : ''}
        </div>
      `;

      // Chargement des produits
      SM_PRODUITS.tousProduits().then(function(produits) {
        tousLesProduits = produits.filter(function(p) {
          return (p.boutique || '').trim().toLowerCase() === vendeurActuel.boutique.trim().toLowerCase();
        });
        
        remplirCategories(tousLesProduits);
        afficher();
      });

    }).catch(function() {
      headerContainer.innerHTML = '<h2 style="color:#fff; text-align:center; width:100%;">Erreur de chargement</h2>';
    });

    function remplirCategories(liste) {
      var cats = {};
      for (var i = 0; i < liste.length; i++) {
        if (liste[i].categorie) cats[liste[i].categorie] = true;
      }
      var noms = Object.keys(cats).sort();
      catSelect.innerHTML = '<option value="Tout">Toutes categories</option>';
      for (var j = 0; j < noms.length; j++) {
        var opt = document.createElement('option');
        opt.value = noms[j];
        opt.textContent = noms[j];
        catSelect.appendChild(opt);
      }
    }

    function afficher() {
      var mot = searchInput.value.trim().toLowerCase();
      var sort = sortSelect.value;
      var cat = catSelect.value;

      var filtres = tousLesProduits.filter(function(p) {
        if (mot && (p.nom || '').toLowerCase().indexOf(mot) === -1) return false;
        if (cat !== 'Tout' && p.categorie !== cat) return false;
        return true;
      });

      if (sort === 'prix_asc') filtres.sort(function(a,b) { return a.prix - b.prix; });
      else if (sort === 'prix_desc') filtres.sort(function(a,b) { return b.prix - a.prix; });
      else if (sort === 'nom') filtres.sort(function(a,b) { return a.nom.localeCompare(b.nom); });

      grid.innerHTML = '';
      if (!filtres.length) {
        shopVide.classList.remove('hidden');
        return;
      }
      shopVide.classList.add('hidden');
      
      for (var i = 0; i < filtres.length; i++) {
        grid.appendChild(SM_APP.creerCarteProduit(filtres[i]));
      }
    }

    searchInput.addEventListener('input', afficher);
    sortSelect.addEventListener('change', afficher);
    catSelect.addEventListener('change', afficher);
  });
</script>
</body>
</html>
