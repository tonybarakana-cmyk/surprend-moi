</main>

    <div class="footer-links">
      <a href="index.html">Accueil</a>
      <a href="a-propos.html">A propos</a>
      <a href="confidentialite.html">Politique de confidentialite</a>
    </div>
  </div>
</footer>

    Categories
  </a>
  <a href="vendeurs.html">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    Vendeurs
  </a>
  <a href="mon-compte.html">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>

<script src="js/config.js"></script>
<script src="js/track.js"></script>
<script src="js/auth.js"></script>
<script src="js/produits.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var params = new URLSearchParams(location.search);
    var shopName = params.get('shop');
    var headerContainer = document.getElementById('shopHeader');
    var grid = document.getElementById('shopProduits');

    if (!shopName) {
      headerContainer.innerHTML = '<h2 style="color:#fff; text-align:center; width:100%;">Boutique introuvable</h2>';
      grid.innerHTML = '';
      return;
    }

    SM_PRODUITS.tousVendeurs().then(function(vendeurs) {
      var vendeur = vendeurs.find(function(v) { 
        return v.boutique.toLowerCase() === shopName.toLowerCase(); 
      });

      if (!vendeur) {
        headerContainer.innerHTML = '<h2 style="color:#fff; text-align:center; width:100%;">Boutique introuvable</h2>';
        return;
      }

      var initiale = vendeur.boutique.charAt(0).toUpperCase();
      var photoHtml = vendeur.photo 
        ? `<img src="${vendeur.photo}" style="width: 100%; height: 100%; object-fit: cover;">` 
        : initiale;

      headerContainer.innerHTML = `
        <div style="width: 80px; height: 80px; background: var(--accent-1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; color: #000; overflow: hidden; border: 2px solid var(--accent-2); flex-shrink: 0;">
          ${photoHtml}
        </div>
        <div>
          <h1 style="font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 4px;">${vendeur.boutique}</h1>
          <p style="font-size: 14px; color: var(--text-soft); margin-bottom: 4px;">${vendeur.zone}</p>
          ${vendeur.specialite ? `<span style="font-size: 12px; background: rgba(22,199,101,0.1); color: var(--accent-2); padding: 4px 10px; border-radius: 6px; font-weight: 700;">Spécialité : ${vendeur.specialite}</span>` : ''}
        </div>
      `;

      SM_PRODUITS.tousProduits().then(function(produits) {
        var mesProduits = produits.filter(function(p) {
          return (p.boutique || '').toLowerCase() === vendeur.boutique.toLowerCase();
        });

        grid.innerHTML = '';
        if (!mesProduits.length) {
          grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>Aucun produit disponible pour le moment</h3></div>';
          return;
        }

        for (var i = 0; i < mesProduits.length; i++) {
          grid.appendChild(SM_APP.creerCarteProduit(mesProduits[i]));
        }
      });

    }).catch(function() {
      headerContainer.innerHTML = '<h2 style="color:#fff; text-align:center; width:100%;">Erreur de chargement</h2>';
    });
  });
</script>
</body>
</html>
