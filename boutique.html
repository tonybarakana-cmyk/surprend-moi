<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07110B">
<title>Boutique - Surprend Moi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="header-container">
    <a href="index.html" class="brand" id="logoLink">
      <img src="https://res.cloudinary.com/mtwv68nx/image/upload/w_150,q_auto,f_auto/v1792677426/mfd0dxaprxrc6u5pjmo9.png" alt="Surprend Moi" class="logo">
    </a>
    <nav class="nav-main" id="navMain">
      <a href="index.html" class="nav-link" id="navAccueil">Accueil</a>
      <a href="index.html#produits" class="nav-link" id="navCategories">Categories</a>
      <a href="vendeurs.html" class="nav-link" id="navVendeurs">Vendeurs</a>
      <a href="mon-compte.html" class="nav-link" id="navCompte">Mon Compte</a>
    </nav>
    <div class="header-actions">
      <a href="connexion.html" class="btn btn-ghost" id="btnNavConnexion">Connexion</a>
      <a href="inscription.html" class="btn btn-primary" id="btnNavInscription">S'inscrire</a>
    </div>
  </div>
</header>

<main class="main-layout" style="grid-template-columns: 1fr; max-width: 1200px; margin-top: 100px;">
  
  <div id="shopHeader" style="display: flex; align-items: center; gap: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-bottom: 30px;">
    <div class="loader"></div>
  </div>

  <div class="section-header">
    <h2 class="section-title">Nos produits</h2>
  </div>
  
  <div id="shopProduits" class="produits-grid">
    <div class="loader"></div>
  </div>

</main>

<footer class="footer">
  <div class="footer-container">
    <img src="https://res.cloudinary.com/mtwv68nx/image/upload/w_120,q_auto,f_auto/v1792677426/mfd0dxaprxrc6u5pjmo9.png" alt="Surprend Moi" class="logo-footer">
    <div class="footer-links">
      <a href="index.html" id="footerAccueil">Accueil</a>
      <a href="a-propos.html">A propos</a>
      <a href="confidentialite.html">Politique de confidentialite</a>
    </div>
  </div>
</footer>

<nav class="mobile-nav" id="mobileNav">
  <a href="index.html" id="mobileAccueil">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    Accueil
  </a>
  <a href="index.html#produits" id="mobileCategories">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
    Categories
  </a>
  <a href="vendeurs.html" id="mobileVendeurs">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    Vendeurs
  </a>
  <a href="mon-compte.html" id="mobileCompte">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    Mon Compte
  </a>
</nav>

<script src="js/config.js"></script>
<script src="js/track.js"></script>
<script src="js/auth.js"></script>
<script src="js/produits.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // --- 1. CORRECTION DES LIENS DU MENU SELON LA SESSION ---
    var session = SM_AUTH.getSession();
    if (session) {
      var dashboardUrl = session.role === 'vendeur' ? 'dashboard-vendeur.html' : 'dashboard-client.html';

      // Changer les liens du header
      document.getElementById('logoLink').href = dashboardUrl;
      document.getElementById('navAccueil').href = dashboardUrl;
      document.getElementById('navCategories').href = dashboardUrl + '#produits';
      
      // Changer les liens du footer
      document.getElementById('footerAccueil').href = dashboardUrl;

      // Changer les liens du menu mobile
      document.getElementById('mobileAccueil').href = dashboardUrl;
      document.getElementById('mobileCategories').href = dashboardUrl + '#produits';

      // Masquer les boutons Connexion / S'inscrire
      var btnNavConnexion = document.getElementById('btnNavConnexion');
      var btnNavInscription = document.getElementById('btnNavInscription');
      if (btnNavConnexion) btnNavConnexion.style.display = 'none';
      if (btnNavInscription) btnNavInscription.style.display = 'none';
    }

    // --- 2. CHARGEMENT DE LA BOUTIQUE ---
    var params = new URLSearchParams(location.search);
    var shopName = params.get('shop');
    var headerContainer = document.getElementById('shopHeader');
    var grid = document.getElementById('shopProduits');

    if (shopName) {
      shopName = decodeURIComponent(shopName).trim();
    }

    if (!shopName) {
      headerContainer.innerHTML = '<h2 style="color:#fff; text-align:center; width:100%;">Boutique introuvable</h2>';
      grid.innerHTML = '';
      return;
    }

    SM_PRODUITS.tousVendeurs().then(function(vendeurs) {
      var vendeur = vendeurs.find(function(v) { 
        return v.boutique.trim().toLowerCase() === shopName.toLowerCase(); 
      });

      if (!vendeur) {
        headerContainer.innerHTML = '<h2 style="color:#fff; text-align:center; width:100%;">Boutique introuvable</h2>';
        return;
      }

      var initiale = vendeur.boutique.charAt(0).toUpperCase();
      var photoHtml = vendeur.photo 
        ? `<img src="${vendeur.photo}" style="width: 100%; height: 100%; object-fit: cover;">` 
        : initiale;

      headerContainer.innerHTML = `
        <div style="width: 80px; height: 80px; background: var(--accent-1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; color: #000; overflow: hidden; border: 2px solid var(--accent-2); flex-shrink: 0;">
          ${photoHtml}
        </div>
        <div>
          <h1 style="font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 4px;">${vendeur.boutique}</h1>
          <p style="font-size: 14px; color: var(--text-soft); margin-bottom: 4px;">${vendeur.zone}</p>
          ${vendeur.specialite ? `<span style="font-size: 12px; background: rgba(22,199,101,0.1); color: var(--accent-2); padding: 4px 10px; border-radius: 6px; font-weight: 700;">Spécialité : ${vendeur.specialite}</span>` : ''}
        </div>
      `;

      SM_PRODUITS.tousProduits().then(function(produits) {
        var mesProduits = produits.filter(function(p) {
          return (p.boutique || '').trim().toLowerCase() === vendeur.boutique.trim().toLowerCase();
        });

        grid.innerHTML = '';
        if (!mesProduits.length) {
          grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>Aucun produit disponible pour le moment</h3></div>';
          return;
        }

        for (var i = 0; i < mesProduits.length; i++) {
          grid.appendChild(SM_APP.creerCarteProduit(mesProduits[i]));
        }
      });

    }).catch(function() {
      headerContainer.innerHTML = '<h2 style="color:#fff; text-align:center; width:100%;">Erreur de chargement</h2>';
    });
  });
</script>
</body>
</html>
