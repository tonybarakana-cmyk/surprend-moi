<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b10">
<title>Mon compte - Surprend Moi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <a href="index.html" class="brand">Surprend Moi</a>
  <div class="header-actions">
    <span id="nomClient" style="font-size:13px;color:var(--text-soft);"></span>
    <button id="btnLogout" class="btn btn-ghost btn-small">Deconnexion</button>
  </div>
</header>

<main class="container">

  <h1 class="section-title" style="margin-top:16px;">Mon compte</h1>

  <div class="card" style="margin-bottom:24px;">
    <h2 class="card-title">Mes informations</h2>
    <p style="color:var(--text-soft);font-size:14px;">
      <strong>Nom :</strong> <span id="infoNom"></span><br>
      <strong>Email :</strong> <span id="infoEmail"></span><br>
      <strong>Telephone :</strong> <span id="infoTel"></span>
    </p>
  </div>

  <h2 class="section-title">Produits disponibles</h2>
  <div id="produitsClient" class="produits-grid" style="margin-top:16px;">
    <div class="loader" style="grid-column:1/-1;"></div>
  </div>

  <div class="empty-state hidden" id="vide" style="margin-top:40px;">
    <h3>Aucun produit pour le moment</h3>
    <p>Reviens plus tard.</p>
  </div>

</main>

<footer class="footer">Surprend Moi</footer>

<script src="js/config.js"></script>
<script src="js/track.js"></script>
<script src="js/auth.js"></script>
<script src="js/produits.js"></script>
<script src="js/app.js"></script>
<script>
  var session = SM_AUTH.exigerConnexion('client');
  if (session) {
    document.getElementById('nomClient').textContent = session.nom || session.email;
    document.getElementById('infoNom').textContent = session.nom || '';
    document.getElementById('infoEmail').textContent = session.email || '';
    document.getElementById('infoTel').textContent = session.telephone || '';

    document.getElementById('btnLogout').addEventListener('click', function () {
      SM_AUTH.clearSession();
      location.href = 'index.html';
    });

    var grid = document.getElementById('produitsClient');
    var vide = document.getElementById('vide');

    SM_PRODUITS.tousProduits().then(function (liste) {
      grid.innerHTML = '';
      if (!liste.length) {
        vide.classList.remove('hidden');
        return;
      }
      for (var i = 0; i < liste.length; i++) {
        grid.appendChild(SM_APP.creerCarteProduit(liste[i]));
      }
    }).catch(function () {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>Erreur de chargement</h3></div>';
    });
  }
</script>
</body>
</html>
