<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon compte - Surprend Moi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="header-container">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="Surprend Moi" class="logo">
    </a>
    <div class="header-actions">
      <span id="nomClient" style="font-size:14px; color:var(--text-soft); margin-right:10px;"></span>
      <button id="btnLogout" class="btn btn-ghost">Deconnexion</button>
    </div>
  </div>
</header>

<main class="container" style="max-width: 1200px; margin-top: 30px;">
  
  <div class="section-header">
    <h1 class="section-title">Produits disponibles</h1>
  </div>

  <!-- Barre de recherche avancée -->
  <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 30px;">
    <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px;">
      <input type="text" id="rechercheMot" placeholder="Rechercher un produit..." style="flex: 1; min-width: 200px; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: #fff; outline: none;">
      <select id="rechercheCat" style="padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: #fff; outline: none; min-width: 150px;">
        <option value="">Toutes categories</option>
      </select>
    </div>
    <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
      <input type="number" id="prixMin" placeholder="Prix min" style="flex: 1; min-width: 120px; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: #fff; outline: none;">
      <input type="number" id="prixMax" placeholder="Prix max" style="flex: 1; min-width: 120px; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: #fff; outline: none;">
      <button id="btnReset" class="btn btn-ghost" style="padding: 12px 20px;">Reinitialiser</button>
    </div>
  </div>

  <p id="resultatCount" style="color:var(--text-soft); font-size:14px; margin-bottom: 20px;"></p>

  <div id="produitsClient" class="produits-grid">
    <div class="loader"></div>
  </div>

  <div class="empty-state hidden" id="vide" style="margin-top:40px;">
    <h3>Aucun produit trouve</h3>
    <p>Essaie un autre mot-cle ou une autre categorie.</p>
  </div>

</main>

<footer class="footer" style="margin-top: 60px; padding: 20px; text-align: center;">
  <p style="font-size: 12px; color: var(--text-mute);">&copy; 2025 SurprendMoi. Tous droits reserves.</p>
</footer>

<script src="js/config.js"></script>
<script src="js/track.js"></script>
<script src="js/auth.js"></script>
<script src="js/produits.js"></script>
<script src="js/app.js"></script>
<script>
  var session = SM_AUTH.exigerConnexion('client');
  if (session) {
    document.getElementById('nomClient').textContent = session.nom || session.email;
    
    document.getElementById('btnLogout').addEventListener('click', function () {
      SM_AUTH.clearSession();
      location.href = 'index.html';
    });

    var tousLesProduits = [];
    var grid = document.getElementById('produitsClient');
    var vide = document.getElementById('vide');
    var count = document.getElementById('resultatCount');
    var inputMot = document.getElementById('rechercheMot');
    var selectCat = document.getElementById('rechercheCat');
    var inputMin = document.getElementById('prixMin');
    var inputMax = document.getElementById('prixMax');

    SM_PRODUITS.tousProduits().then(function (liste) {
      tousLesProduits = liste;
      remplirCategories(liste);
      afficher(liste);
    }).catch(function () {
      grid.innerHTML = '';
      vide.classList.remove('hidden');
      vide.querySelector('h3').textContent = 'Erreur de chargement';
      vide.querySelector('p').textContent = 'Verifie ta connexion internet.';
    });

    function remplirCategories(liste) {
      var cats = {};
      for (var i = 0; i < liste.length; i++) {
        if (liste[i].categorie) cats[liste[i].categorie] = true;
      }
      var noms = Object.keys(cats).sort();
      for (var j = 0; j < noms.length; j++) {
        var opt = document.createElement('option');
        opt.value = noms[j];
        opt.textContent = noms[j];
        selectCat.appendChild(opt);
      }
    }

    function filtrer() {
      var mot = inputMot.value.trim().toLowerCase();
      var cat = selectCat.value;
      var min = parseFloat(inputMin.value) || 0;
      var max = parseFloat(inputMax.value) || Infinity;

      return tousLesProduits.filter(function (p) {
        if (mot) {
          var nom = (p.nom || '').toLowerCase();
          var desc = (p.description || '').toLowerCase();
          var boutique = (p.boutique || '').toLowerCase();
          if (nom.indexOf(mot) === -1 && desc.indexOf(mot) === -1 && boutique.indexOf(mot) === -1) return false;
        }
        if (cat && p.categorie !== cat) return false;
        var prix = Number(p.prix) || 0;
        if (prix < min) return false;
        if (prix > max) return false;
        return true;
      });
    }

    function afficher(liste) {
      grid.innerHTML = '';
      if (!liste.length) {
        vide.classList.remove('hidden');
        count.textContent = '';
        return;
      }
      vide.classList.add('hidden');
      count.textContent = liste.length + ' produit' + (liste.length > 1 ? 's' : '') + ' trouve' + (liste.length > 1 ? 's' : '');
      for (var i = 0; i < liste.length; i++) {
        grid.appendChild(SM_APP.creerCarteProduit(liste[i]));
      }
    }

    function rafraichir() {
      afficher(filtrer());
    }

    inputMot.addEventListener('input', rafraichir);
    selectCat.addEventListener('change', rafraichir);
    inputMin.addEventListener('input', rafraichir);
    inputMax.addEventListener('input', rafraichir);

    document.getElementById('btnReset').addEventListener('click', function () {
      inputMot.value = '';
      selectCat.value = '';
      inputMin.value = '';
      inputMax.value = '';
      afficher(tousLesProduits);
    });
  }
</script>
</body>
</html>
