<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma boutique - Surprend Moi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="header-container">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="Surprend Moi" class="logo">
    </a>
    <div class="header-actions">
      <span id="nomVendeur" style="font-size:14px; color:var(--text-soft); margin-right:10px;"></span>
      <button id="btnLogout" class="btn btn-ghost">Deconnexion</button>
    </div>
  </div>
</header>

<main class="container" style="max-width: 1200px; margin-top: 30px;">
  
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; margin-bottom: 30px;">
    <h1 class="section-title" style="margin:0;">Ma boutique</h1>
    <a href="ajouter-produit.html" class="btn btn-primary" style="padding: 12px 24px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Ajouter un produit
    </a>
  </div>

  <!-- Section Produits Disponibles -->
  <h2 class="section-title">Mes produits disponibles</h2>
  <div id="produitsDisponibles" class="produits-grid">
    <div class="loader"></div>
  </div>

  <!-- Section Produits Vendus -->
  <h2 class="section-title" style="margin-top: 50px;">Vendus recemment (48h)</h2>
  <div id="produitsVendus" class="produits-grid">
    <div class="loader"></div>
  </div>

</main>

<footer class="footer" style="margin-top: 60px; padding: 20px; text-align: center;">
  <p style="font-size: 12px; color: var(--text-mute);">&copy; 2025 SurprendMoi. Tous droits reserves.</p>
</footer>

<script src="js/config.js"></script>
<script src="js/track.js"></script>
<script src="js/auth.js"></script>
<script src="js/produits.js"></script>
<script src="js/app.js"></script>
<script>
  var session = SM_AUTH.exigerConnexion('vendeur');
  if (session) {
    document.getElementById('nomVendeur').textContent = session.boutique || session.nom || session.email;

    document.getElementById('btnLogout').addEventListener('click', function () {
      SM_AUTH.clearSession();
      location.href = 'index.html';
    });

    function charger() {
      var dispo = document.getElementById('produitsDisponibles');
      var vendus = document.getElementById('produitsVendus');
      dispo.innerHTML = '<div class="loader" style="grid-column:1/-1;"></div>';
      vendus.innerHTML = '<div class="loader" style="grid-column:1/-1;"></div>';

      SM_PRODUITS.mesProduits().then(function (liste) {
        var disponibles = [];
        var vendusListe = [];
        for (var i = 0; i < liste.length; i++) {
          if (liste[i].statut === 'vendu') {
            vendusListe.push(liste[i]);
          } else {
            disponibles.push(liste[i]);
          }
        }

        // Afficher disponibles
        dispo.innerHTML = '';
        if (!disponibles.length) {
          dispo.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>Aucun produit disponible</h3><p>Ajoute ton premier produit.</p></div>';
        } else {
          for (var j = 0; j < disponibles.length; j++) {
            var carte = SM_APP.creerCarteProduit(disponibles[j], { actions: 'disponible' });
            attacherActions(carte);
            dispo.appendChild(carte);
          }
        }

        // Afficher vendus
        vendus.innerHTML = '';
        if (!vendusListe.length) {
          vendus.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>Aucun produit vendu recemment</h3></div>';
        } else {
          for (var k = 0; k < vendusListe.length; k++) {
            var carteV = SM_APP.creerCarteProduit(vendusListe[k], { actions: 'vendu' });
            attacherActions(carteV);
            vendus.appendChild(carteV);
          }
        }
      });
    }

    function attacherActions(carte) {
      var btnMarquer = carte.querySelector('.btn-marquer');
      if (btnMarquer) {
        btnMarquer.addEventListener('click', function () {
          var id = this.getAttribute('data-id');
          if (!confirm('Marquer ce produit comme vendu ?')) return;
          SM_PRODUITS.marquerVendu(id).then(function () {
            charger();
          });
        });
      }

      var btnRestaurer = carte.querySelector('.btn-restaurer');
      if (btnRestaurer) {
        btnRestaurer.addEventListener('click', function () {
          var id = this.getAttribute('data-id');
          if (!confirm('Restaurer ce produit ?')) return;
          SM_PRODUITS.restaurerProduit(id).then(function () {
            charger();
          });
        });
      }

      var btnSuppr = carte.querySelector('.btn-supprimer');
      if (btnSuppr) {
        btnSuppr.addEventListener('click', function () {
          var id = this.getAttribute('data-id');
          if (!confirm('Supprimer ce produit ?')) return;
          SM_PRODUITS.supprimerProduit(id).then(function () {
            charger();
          });
        });
      }
    }

    charger();

    setInterval(function () {
      var compteurs = document.querySelectorAll('.compte-a-rebours');
      for (var i = 0; i < compteurs.length; i++) {
        var dv = compteurs[i].getAttribute('data-datevente');
        var temps = SM_APP.calculerTempsRestant(dv);
        if (temps) compteurs[i].textContent = temps.texte;
      }
    }, 60000);
  }
</script>
</body>
</html>
