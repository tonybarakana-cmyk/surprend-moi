<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07110B">
<title>Ma boutique - Surprend Moi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="header-container" style="justify-content: space-between;">
    <a href="dashboard-vendeur.html" class="brand">
      <img src="https://res.cloudinary.com/mtwv68nx/image/upload/w_150,q_auto,f_auto/v1792677426/mfd0dxaprxrc6u5pjmo9.png" alt="Surprend Moi" class="logo">
    </a>
    
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="mon-compte.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer;">
        <div id="avatarVendeur" style="width: 44px; height: 44px; background: var(--accent-1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; color: #000; overflow: hidden; border: 2px solid var(--accent-2);">
        </div>
        <div>
          <span id="nomVendeur" style="display: block; font-size: 14px; color: #fff; font-weight: 800;">Boutique</span>
          <span style="display: block; font-size: 11px; color: var(--accent-2);">Modifier mon profil</span>
        </div>
      </a>
      
      <button id="btnLogout" class="btn btn-ghost" style="color: #f87171; border-color: rgba(239, 68, 68, 0.3); padding: 8px 16px; font-size: 13px;">Deconnexion</button>
    </div>
  </div>
</header>

<main class="container" style="max-width: 1200px; margin-top: 100px;">
  
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; margin-bottom: 30px;">
    <h1 class="section-title" style="margin:0;">Ma boutique</h1>
    <a href="ajouter-produit.html" class="btn btn-primary" style="padding: 12px 24px;">Ajouter un produit</a>
  </div>

  <h2 class="section-title">Mes produits disponibles</h2>
  <div id="produitsDisponibles" class="produits-grid">
    <div class="loader"></div>
  </div>

  <h2 class="section-title" style="margin-top: 50px;">Vendus recemment (48h)</h2>
  <div id="produitsVendus" class="produits-grid">
    <div class="loader"></div>
  </div>

</main>

<footer class="footer" style="margin-top: 60px; padding: 20px; text-align: center;">
  <p style="font-size: 12px; color: var(--text-mute);">&copy; 2025 SurprendMoi. Tous droits reserves.</p>
</footer>

<script src="js/config.js"></script>
<script src="js/track.js"></script>
<script src="js/auth.js"></script>
<script src="js/produits.js"></script>
<script src="js/app.js"></script>
<script>
  // VÉRIFICATION MANUELLE DE LA SESSION
  var session = SM_AUTH.getSession();
  
  if (!session || session.role !== 'vendeur') {
    // Si pas de session ou pas vendeur, on redirige
    window.location.href = 'connexion.html';
  } else {
    // --- GESTION DU PROFIL VENDEUR ---
    var avatarDiv = document.getElementById('avatarVendeur');
    var nomVendeurSpan = document.getElementById('nomVendeur');
    
    var nomAffiche = session.boutique || session.nom || session.email;
    nomVendeurSpan.textContent = nomAffiche;

    if (session.photo && session.photo.trim() !== '') {
      avatarDiv.innerHTML = '<img src="' + session.photo + '" style="width: 100%; height: 100%; object-fit: cover;">';
    } else {
      var initiale = nomAffiche.charAt(0).toUpperCase();
      avatarDiv.textContent = initiale;
    }

    // --- DECONNEXION ---
    document.getElementById('btnLogout').addEventListener('click', function () {
      SM_AUTH.clearSession();
      window.location.href = 'index.html';
    });

    // --- CHARGEMENT DES PRODUITS ---
    function charger() {
      var dispo = document.getElementById('produitsDisponibles');
      var vendus = document.getElementById('produitsVendus');
      dispo.innerHTML = '<div class="loader" style="grid-column:1/-1;"></div>';
      vendus.innerHTML = '<div class="loader" style="grid-column:1/-1;"></div>';

      SM_PRODUITS.mesProduits().then(function (liste) {
        var disponibles = [];
        var vendusListe = [];
        for (var i = 0; i < liste.length; i++) {
          if (liste[i].statut === 'vendu') {
            vendusListe.push(liste[i]);
          } else {
            disponibles.push(liste[i]);
          }
        }

        dispo.innerHTML = '';
        if (!disponibles.length) {
          dispo.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>Aucun produit disponible</h3></div>';
        } else {
          for (var j = 0; j < disponibles.length; j++) {
            var carte = SM_APP.creerCarteProduit(disponibles[j], { actions: 'disponible' });
            attacherActions(carte);
            dispo.appendChild(carte);
          }
        }

        vendus.innerHTML = '';
        if (!vendusListe.length) {
          vendus.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>Aucun produit vendu recemment</h3></div>';
        } else {
          for (var k = 0; k < vendusListe.length; k++) {
            var carteV = SM_APP.creerCarteProduit(vendusListe[k], { actions: 'vendu' });
            attacherActions(carteV);
            vendus.appendChild(carteV);
          }
        }
      }).catch(function() {
        dispo.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>Erreur de chargement</h3></div>';
        vendus.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>Erreur de chargement</h3></div>';
      });
    }

    function attacherActions(carte) {
      var btnMarquer = carte.querySelector('.btn-marquer');
      if (btnMarquer) {
        btnMarquer.addEventListener('click', function () {
          var id = this.getAttribute('data-id');
          if (!confirm('Marquer ce produit comme vendu ?')) return;
          SM_PRODUITS.marquerVendu(id).then(function () { charger(); });
        });
      }

      var btnRestaurer = carte.querySelector('.btn-restaurer');
      if (btnRestaurer) {
        btnRestaurer.addEventListener('click', function () {
          var id = this.getAttribute('data-id');
          if (!confirm('Restaurer ce produit ?')) return;
          SM_PRODUITS.restaurerProduit(id).then(function () { charger(); });
        });
      }

      var btnSuppr = carte.querySelector('.btn-supprimer');
      if (btnSuppr) {
        btnSuppr.addEventListener('click', function () {
          var id = this.getAttribute('data-id');
          if (!confirm('Supprimer ce produit ?')) return;
          SM_PRODUITS.supprimerProduit(id).then(function () { charger(); });
        });
      }
    }

    charger();
  }
</script>
</body>
</html>
