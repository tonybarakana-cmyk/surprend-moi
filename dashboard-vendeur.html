<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07110B">
<title>Ma boutique - Surprend Moi</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Styles spécifiques pour le dashboard vendeur */
  .vendor-toolbar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .vendor-search {
    flex: 1;
    min-width: 150px;
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .vendor-search input {
    flex: 1;
    background: none;
    border: none;
    color: #fff;
    outline: none;
    font-size: 14px;
    width: 100%;
  }
  .vendor-search svg { color: var(--text-mute); margin-right: 8px; flex-shrink: 0; }
  .vendor-filter {
    background: var(--bg);
    border: 1px solid var(--border);
    color: #fff;
    padding: 10px 14px;
    border-radius: 10px;
    outline: none;
    font-size: 14px;
    cursor: pointer;
  }
  .vendor-filter option { background: var(--surface); }

  /* Profil compact */
  .profile-compact {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    cursor: pointer;
  }
  .profile-text { display: flex; flex-direction: column; }

  /* Responsive mobile */
  @media (max-width: 768px) {
    .header-container {
      padding: 0 12px !important;
      gap: 8px !important;
    }
    .logo { height: 32px !important; }
    
    /* Cacher le bouton Partager sur mobile */
    #btnShareVendeur { display: none !important; }
    
    /* Cacher le texte du profil, garder juste le cercle */
    .profile-text { display: none !important; }
    
    .header-actions {
      gap: 8px !important;
    }
    
    .header-actions .btn-ghost {
      padding: 6px 10px !important;
      font-size: 11px !important;
    }

    /* Ajuster la toolbar pour qu'elle ne deborde pas */
    .vendor-toolbar {
      padding: 12px;
      gap: 8px;
    }
    .vendor-search {
      min-width: 100%;
      padding: 8px 12px;
    }
    .vendor-filter {
      flex: 1;
      padding: 8px 10px;
      font-size: 13px;
    }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-container" style="justify-content: space-between;">
    <a href="dashboard-vendeur.html" class="brand">
      <img src="https://res.cloudinary.com/mtwv68nx/image/upload/w_150,q_auto,f_auto/v1792677426/mfd0dxaprxrc6u5pjmo9.png" alt="Surprend Moi" class="logo">
    </a>
    
    <div class="header-actions" style="display: flex; align-items: center; gap: 12px;">
      <!-- BOUTON PARTAGER (Caché sur mobile via CSS) -->
      <button id="btnShareVendeur" class="btn btn-ghost" style="padding: 8px 16px; font-size: 13px; display: flex; align-items: center; gap: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        Partager
      </button>

      <!-- PROFIL -->
      <a href="mon-compte.html" class="profile-compact">
        <div id="avatarVendeur" style="width: 40px; height: 40px; background: var(--accent-1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: #000; overflow: hidden; border: 2px solid var(--accent-2); flex-shrink: 0;"></div>
        <div class="profile-text">
          <span id="nomVendeur" style="font-size: 14px; color: #fff; font-weight: 800;">Boutique</span>
          <span style="font-size: 11px; color: var(--accent-2);">Modifier</span>
        </div>
      </a>
      
      <button id="btnLogout" class="btn btn-ghost" style="color: #f87171; border-color: rgba(239, 68, 68, 0.3); padding: 6px 12px; font-size: 12px;">Deconnexion</button>
    </div>
  </div>
</header>

<main class="container" style="max-width: 1200px; margin-top: 100px;">
  
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; margin-bottom: 20px;">
    <h1 class="section-title" style="margin:0;">Ma boutique</h1>
    <a href="ajouter-produit.html" class="btn btn-primary" style="padding: 12px 24px;">Ajouter un produit</a>
  </div>

  <div class="vendor-toolbar">
    <div class="vendor-search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="vendorSearch" placeholder="Rechercher...">
    </div>
    <select id="vendorSort" class="vendor-filter">
      <option value="recent">Recents</option>
      <option value="prix_asc">Prix ↑</option>
      <option value="prix_desc">Prix ↓</option>
      <option value="nom">Nom A-Z</option>
    </select>
    <select id="vendorCat" class="vendor-filter">
      <option value="Tout">Categories</option>
    </select>
  </div>

  <h2 class="section-title">Mes produits disponibles</h2>
  <div id="produitsDisponibles" class="produits-grid">
    <div class="loader"></div>
  </div>

  <h2 class="section-title" style="margin-top: 50px;">Vendus recemment (48h)</h2>
  <div id="produitsVendus" class="produits-grid">
    <div class="loader"></div>
  </div>

</main>

<footer class="footer" style="margin-top: 60px; padding: 40px 20px; text-align: center; background: var(--surface); border-top: 1px solid var(--border);">
  <div class="footer-container">
    <img src="https://res.cloudinary.com/mtwv68nx/image/upload/w_120,q_auto,f_auto/v1792677426/mfd0dxaprxrc6u5pjmo9.png" alt="Surprend Moi" class="logo-footer" style="margin: 0 auto 16px;">
    <div class="footer-links" style="justify-content: center; margin-bottom: 16px;">
      <a href="dashboard-vendeur.html">Ma boutique</a>
      <a href="mon-compte.html">Mon profil</a>
      <a href="a-propos.html">A propos</a>
    </div>
    <p style="font-size: 12px; color: var(--text-mute);">&copy; 2025 SurprendMoi. Tous droits reserves.</p>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/track.js"></script>
<script src="js/auth.js"></script>
<script src="js/produits.js"></script>
<script src="js/app.js"></script>
<script>
  var session = SM_AUTH.exigerConnexion('vendeur');
  if (session) {
    var avatarDiv = document.getElementById('avatarVendeur');
    var nomVendeurSpan = document.getElementById('nomVendeur');
    var nomAffiche = session.boutique || session.nom || session.email;
    nomVendeurSpan.textContent = nomAffiche;

    if (session.photo && session.photo.trim() !== '') {
      avatarDiv.innerHTML = '<img src="' + session.photo + '" style="width: 100%; height: 100%; object-fit: cover;">';
    } else {
      avatarDiv.textContent = nomAffiche.charAt(0).toUpperCase();
    }

    // --- PARTAGE ---
    document.getElementById('btnShareVendeur').addEventListener('click', function() {
      var nomBoutique = session.boutique || session.nom;
      var baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      var shopUrl = baseUrl + 'boutique.html?shop=' + encodeURIComponent(nomBoutique);
      
      var shareData = {
        title: 'Découvre ma boutique ' + nomBoutique + ' sur Surprend Moi',
        text: 'Viens découvrir mes produits sur Surprend Moi !',
        url: shopUrl
      };
      
      if (navigator.share) {
        navigator.share(shareData).catch(function() {});
      } else {
        var tempInput = document.createElement('input');
        tempInput.value = shareData.url;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        alert('Lien de ma boutique copié : ' + shareData.url);
      }
    });

    document.getElementById('btnLogout').addEventListener('click', function () {
      SM_AUTH.clearSession();
      location.href = 'index.html';
    });

    var tousMesProduits = [];
    var gridDispo = document.getElementById('produitsDisponibles');
    var gridVendus = document.getElementById('produitsVendus');
    var inputSearch = document.getElementById('vendorSearch');
    var selectSort = document.getElementById('vendorSort');
    var selectCat = document.getElementById('vendorCat');

    function charger() {
      gridDispo.innerHTML = '<div class="loader" style="grid-column:1/-1;"></div>';
      gridVendus.innerHTML = '<div class="loader" style="grid-column:1/-1;"></div>';

      SM_PRODUITS.mesProduits().then(function (liste) {
        tousMesProduits = liste;
        remplirCategories(liste);
        afficher();
      });
    }

    function remplirCategories(liste) {
      var cats = {};
      for (var i = 0; i < liste.length; i++) {
        if (liste[i].categorie) cats[liste[i].categorie] = true;
      }
      var noms = Object.keys(cats).sort();
      selectCat.innerHTML = '<option value="Tout">Categories</option>';
      for (var j = 0; j < noms.length; j++) {
        var opt = document.createElement('option');
        opt.value = noms[j];
        opt.textContent = noms[j];
        selectCat.appendChild(opt);
      }
    }

    function afficher() {
      var mot = inputSearch.value.trim().toLowerCase();
      var sort = selectSort.value;
      var cat = selectCat.value;

      var filtres = tousMesProduits.filter(function(p) {
        if (mot && (p.nom || '').toLowerCase().indexOf(mot) === -1) return false;
        if (cat !== 'Tout' && p.categorie !== cat) return false;
        return true;
      });

      if (sort === 'prix_asc') filtres.sort(function(a,b) { return a.prix - b.prix; });
      else if (sort === 'prix_desc') filtres.sort(function(a,b) { return b.prix - a.prix; });
      else if (sort === 'nom') filtres.sort(function(a,b) { return a.nom.localeCompare(b.nom); });
      
      var disponibles = [];
      var vendusListe = [];
      for (var i = 0; i < filtres.length; i++) {
        if (filtres[i].statut === 'vendu') vendusListe.push(filtres[i]);
        else disponibles.push(filtres[i]);
      }

      gridDispo.innerHTML = '';
      if (!disponibles.length) {
        gridDispo.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>Aucun produit disponible</h3></div>';
      } else {
        for (var j = 0; j < disponibles.length; j++) {
          var carte = SM_APP.creerCarteProduit(disponibles[j], { actions: 'disponible' });
          attacherActions(carte);
          gridDispo.appendChild(carte);
        }
      }

      gridVendus.innerHTML = '';
      if (!vendusListe.length) {
        gridVendus.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>Aucun produit vendu recemment</h3></div>';
      } else {
        for (var k = 0; k < vendusListe.length; k++) {
          var carteV = SM_APP.creerCarteProduit(vendusListe[k], { actions: 'vendu' });
          attacherActions(carteV);
          gridVendus.appendChild(carteV);
        }
      }
    }

    function attacherActions(carte) {
      var btnMarquer = carte.querySelector('.btn-marquer');
      if (btnMarquer) {
        btnMarquer.addEventListener('click', function () {
          var id = this.getAttribute('data-id');
          if (!confirm('Marquer ce produit comme vendu ?')) return;
          SM_PRODUITS.marquerVendu(id).then(function () { charger(); });
        });
      }
      var btnRestaurer = carte.querySelector('.btn-restaurer');
      if (btnRestaurer) {
        btnRestaurer.addEventListener('click', function () {
          var id = this.getAttribute('data-id');
          if (!confirm('Restaurer ce produit ?')) return;
          SM_PRODUITS.restaurerProduit(id).then(function () { charger(); });
        });
      }
      var btnSuppr = carte.querySelector('.btn-supprimer');
      if (btnSuppr) {
        btnSuppr.addEventListener('click', function () {
          var id = this.getAttribute('data-id');
          if (!confirm('Supprimer ce produit ?')) return;
          SM_PRODUITS.supprimerProduit(id).then(function () { charger(); });
        });
      }
    }

    inputSearch.addEventListener('input', afficher);
    selectSort.addEventListener('change', afficher);
    selectCat.addEventListener('change', afficher);

    charger();
  }
</script>
</body>
</html>
