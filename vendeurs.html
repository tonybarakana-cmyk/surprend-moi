<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nos Vendeurs - Surprend Moi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="header-container">
    <a href="index.html" class="brand"><img src="images/logo.png" alt="Surprend Moi" class="logo"></a>
    <nav class="nav-main">
      <a href="index.html" class="nav-link">Accueil</a>
      <a href="index.html#produits" class="nav-link">Categories</a>
      <a href="vendeurs.html" class="nav-link active">Vendeurs</a>
      <a href="a-propos.html" class="nav-link">A propos</a>
    </nav>
    <div class="header-actions">
      <a href="connexion.html" class="btn btn-ghost">Connexion</a>
      <a href="inscription.html" class="btn btn-primary">S'inscrire</a>
    </div>
  </div>
</header>

<main class="main-layout" style="grid-template-columns: 1fr; max-width: 1000px; margin-top: 40px;">
  <div class="section-header">
    <h2 class="section-title">Tous nos vendeurs</h2>
  </div>
  
  <div id="listeVendeurs" class="produits-grid" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));">
    <div class="loader"></div>
  </div>
</main>

<footer class="footer">
  <div class="footer-container">
    <img src="images/logo.png" alt="Surprend Moi" class="logo-footer">
    <div class="footer-links">
      <a href="index.html">Accueil</a>
      <a href="a-propos.html">A propos</a>
      <a href="#">Contact</a>
    </div>
    <div class="footer-copy">&copy; 2025 SurprendMoi.</div>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/track.js"></script>
<script src="js/auth.js"></script>
<script>
  // Simulation d'une liste de vendeurs (à connecter plus tard si besoin)
  // Pour l'instant, on affiche un message clair.
  setTimeout(function() {
    document.getElementById('listeVendeurs').innerHTML = `
      <div class="info-card" style="grid-column: 1/-1; flex-direction: column; text-align: center; padding: 40px;">
        <h3 style="margin-bottom: 10px;">Rejoignez notre réseau de vendeurs</h3>
        <p style="margin-bottom: 20px; color: var(--text-soft);">Des dizaines de commerçants burundais nous font déjà confiance.</p>
        <a href="inscription-vendeur.html" class="btn btn-primary">Devenir vendeur</a>
      </div>
    `;
  }, 500);
</script>
</body>
</html>
