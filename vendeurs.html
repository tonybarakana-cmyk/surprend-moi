    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>

<script src="js/config.js"></script>
<script src="js/track.js"></script>
<script src="js/auth.js"></script>
<script src="js/produits.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var container = document.getElementById('listeVendeurs');
    
    SM_PRODUITS.tousVendeurs().then(function(vendeurs) {
      container.innerHTML = '';

      if (vendeurs.length === 0) {
        container.innerHTML = `
          <div class="info-card" style="grid-column: 1/-1; flex-direction: column; text-align: center; padding: 40px;">
            <h3 style="margin-bottom: 10px; color:#fff;">Aucun vendeur pour le moment</h3>
            <p style="margin-bottom: 20px; color: var(--text-soft);">Soyez le premier à rejoindre notre réseau de vendeurs.</p>
            <a href="inscription-vendeur.html" class="btn btn-primary">Devenir vendeur</a>
          </div>
        `;
        return;
      }

      for (var j = 0; j < vendeurs.length; j++) {
        var v = vendeurs[j];
        var initiale = v.boutique.charAt(0).toUpperCase();
        var photoHtml = v.photo 
          ? `<img src="${v.photo}" style="width: 100%; height: 100%; object-fit: cover;">` 
          : initiale;
        
        var card = document.createElement('div');
        card.className = 'info-card';
        card.style.flexDirection = 'column';
        card.style.textAlign = 'center';
        card.style.padding = '24px';
        card.style.alignItems = 'center';
        
        card.innerHTML = `
          <div style="width: 60px; height: 60px; background: var(--accent-1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: #000; margin-bottom: 16px; overflow: hidden; border: 2px solid var(--accent-2);">
            ${photoHtml}
          </div>
          <h4 style="font-size: 18px; margin-bottom: 6px;">${v.boutique}</h4>
          <p style="font-size: 13px; color: var(--text-soft); margin-bottom: 8px;">${v.zone}</p>
          ${v.specialite ? `<p style="font-size: 12px; background: rgba(22,199,101,0.1); color: var(--accent-2); padding: 4px 10px; border-radius: 6px; margin-bottom: 16px;">Spécialité : ${v.specialite}</p>` : '<div style="margin-bottom:16px;"></div>'}
          <a href="boutique.html?shop=${encodeURIComponent(v.boutique)}" class="btn btn-primary" style="width: 100%;">Voir la boutique</a>
        `;
        container.appendChild(card);
      }

      var btnDiv = document.createElement('div');
      btnDiv.style.gridColumn = '1/-1';
      btnDiv.style.textAlign = 'center';
      btnDiv.style.marginTop = '30px';
      btnDiv.innerHTML = `<a href="inscription-vendeur.html" class="btn btn-ghost">Vous voulez vendre ? Inscrivez-vous ici</a>`;
      container.appendChild(btnDiv);

    }).catch(function(err) {
      console.error(err);
      container.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>Erreur de chargement</h3></div>';
    });
  });
</script>
</body>
</html>
